<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>Controle Financeiro</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(960px, calc(100% - 32px)); margin: 48px auto; }
    header { margin-bottom: 28px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.3rem); }
    header p { margin: 0; color: #657087; }
    .resumos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
    .card, .painel { background: #fff; border: 1px solid #e7eaf0; border-radius: 16px; box-shadow: 0 4px 16px #17203308; }
    .card { padding: 20px; }
    .card span { display: block; color: #657087; font-size: .9rem; margin-bottom: 12px; }
    .card strong { font-size: clamp(1.2rem, 3vw, 1.65rem); overflow-wrap: anywhere; }
    .verde { color: #16845b; }
    .vermelho { color: #c34444; }
    .painel { padding: 24px; margin-bottom: 22px; }
    h2 { font-size: 1.15rem; margin: 0 0 18px; }
    form { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
    label { display: grid; gap: 7px; font-size: .85rem; font-weight: 600; color: #465168; }
    input, select, button { min-height: 44px; border-radius: 9px; font: inherit; }
    input, select { width: 100%; padding: 0 11px; border: 1px solid #dce1e9; background: #fff; color: #172033; }
    input:focus, select:focus { outline: 3px solid #dce9ff; border-color: #3974d8; }
    button { padding: 0 16px; border: 0; background: #245fc5; color: #fff; font-weight: 700; cursor: pointer; }
    button:hover { background: #194da5; }
    .lista-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .lista-topo h2 { margin-bottom: 0; }
    .lista { list-style: none; padding: 0; margin: 16px 0 0; }
    .item { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 15px 0; border-top: 1px solid #edf0f4; }
    .detalhes { min-width: 0; }
    .detalhes strong { display: block; overflow-wrap: anywhere; }
    .detalhes small { color: #657087; }
    .valor-item { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
    .excluir { min-height: 36px; padding: 0 10px; background: #fff; color: #b23d3d; border: 1px solid #eed4d4; }
    .excluir:hover { background: #fff2f2; }
    .vazio { padding: 24px 0 4px; color: #657087; text-align: center; }
    @media (max-width: 760px) {
      main { margin: 28px auto; }
      .resumos { grid-template-columns: 1fr; gap: 10px; }
      .card { padding: 16px; }
      .card span { margin-bottom: 6px; }
      form { grid-template-columns: 1fr 1fr; }
      form label:first-child { grid-column: 1 / -1; }
      form button { grid-column: 1 / -1; }
    }
    @media (max-width: 420px) {
      .painel { padding: 18px; }
      form { grid-template-columns: 1fr; }
      form label:first-child, form button { grid-column: auto; }
      .item { align-items: flex-start; }
      .valor-item { align-items: flex-end; flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Controle financeiro</h1>
      <p>Acompanhe suas entradas, despesas e saldo em um só lugar.</p>
    </header>

    <section class="resumos" aria-label="Resumo financeiro">
      <article class="card"><span>Saldo atual</span><strong id="saldo">R$ 0,00</strong></article>
      <article class="card"><span>Total de entradas</span><strong class="verde" id="entradas">R$ 0,00</strong></article>
      <article class="card"><span>Total de saídas</span><strong class="vermelho" id="saidas">R$ 0,00</strong></article>
    </section>

    <section class="painel" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Adicionar lançamento</h2>
      <form id="formulario">
        <label for="descricao">Descrição
          <input id="descricao" name="descricao" type="text" placeholder="Ex.: salário ou mercado" maxlength="80" required>
        </label>
        <label for="tipo">Tipo
          <select id="tipo" name="tipo">
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>
        </label>
        <label for="valor">Valor (R$)
          <input id="valor" name="valor" type="number" min="0.01" step="0.01" placeholder="0,00" required>
        </label>
        <label for="data">Data
          <input id="data" name="data" type="date" required>
        </label>
        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section class="painel" aria-labelledby="titulo-lista">
      <div class="lista-topo"><h2 id="titulo-lista">Lançamentos</h2></div>
      <ul class="lista" id="lista" aria-live="polite"></ul>
      <p class="vazio" id="vazio">Nenhum lançamento ainda. Adicione sua primeira entrada ou saída.</p>
    </section>
  </main>

  <script>
    const lancamentos = [];
    const formulario = document.querySelector("#formulario");
    const lista = document.querySelector("#lista");
    const campoData = document.querySelector("#data");
    const moeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const formatoData = new Intl.DateTimeFormat("pt-BR", { timeZone: "UTC" });

    campoData.value = new Date().toISOString().slice(0, 10);

    function atualizarResumo() {
      const entradas = lancamentos
        .filter((item) => item.tipo === "entrada")
        .reduce((total, item) => total + item.valor, 0);
      const saidas = lancamentos
        .filter((item) => item.tipo === "saida")
        .reduce((total, item) => total + item.valor, 0);

      document.querySelector("#saldo").textContent = moeda.format(entradas - saidas);
      document.querySelector("#entradas").textContent = moeda.format(entradas);
      document.querySelector("#saidas").textContent = moeda.format(saidas);
    }

    function renderizarLancamentos() {
      lista.replaceChildren();
      document.querySelector("#vazio").hidden = lancamentos.length > 0;

      [...lancamentos].reverse().forEach((item) => {
        const linha = document.createElement("li");
        linha.className = "item";

        const detalhes = document.createElement("div");
        detalhes.className = "detalhes";
        const descricao = document.createElement("strong");
        descricao.textContent = item.descricao;
        const data = document.createElement("small");
        data.textContent = `${item.tipo === "entrada" ? "Entrada" : "Saída"} · ${formatoData.format(new Date(`${item.data}T00:00:00Z`))}`;
        detalhes.append(descricao, data);

        const valor = document.createElement("strong");
        valor.className = item.tipo === "entrada" ? "verde" : "vermelho";
        valor.textContent = `${item.tipo === "entrada" ? "+" : "−"} ${moeda.format(item.valor)}`;

        const excluir = document.createElement("button");
        excluir.type = "button";
        excluir.className = "excluir";
        excluir.textContent = "Excluir";
        excluir.setAttribute("aria-label", `Excluir lançamento: ${item.descricao}`);
        excluir.addEventListener("click", () => {
          const indice = lancamentos.findIndex((lancamento) => lancamento.id === item.id);
          if (indice !== -1) lancamentos.splice(indice, 1);
          atualizarResumo();
          renderizarLancamentos();
        });

        const valorItem = document.createElement("div");
        valorItem.className = "valor-item";
        valorItem.append(valor, excluir);
        linha.append(detalhes, valorItem);
        lista.append(linha);
      });
    }

    formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();
      const dados = new FormData(formulario);
      const valor = Number(dados.get("valor"));
      if (!Number.isFinite(valor) || valor <= 0) return;

      lancamentos.push({
        id: crypto.randomUUID(),
        descricao: String(dados.get("descricao")).trim(),
        tipo: String(dados.get("tipo")),
        valor,
        data: String(dados.get("data"))
      });

      formulario.reset();
      campoData.value = new Date().toISOString().slice(0, 10);
      atualizarResumo();
      renderizarLancamentos();
      document.querySelector("#descricao").focus();
    });
  </script>
</body>
</html>
